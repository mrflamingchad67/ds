[package]
# The crate is named disk-spacer because `ds` is already taken on crates.io by
# an unrelated robotics library. The installed binary is still `ds`, set below.
name = "disk-spacer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A fast native disk analyzer that shows exactly what is using your space on Windows, Linux, and macOS"
license = "MIT"
readme = "README.md"
repository = "https://github.com/mrflamingchad67/ds"
homepage = "https://github.com/mrflamingchad67/ds"
documentation = "https://github.com/mrflamingchad67/ds#readme"
keywords = ["disk", "usage", "space", "cli", "analyzer"]
categories = ["command-line-utilities", "filesystem"]
# rust-toolchain.toml is repo-only, and target/ is never in a crate package.
exclude = [".github/", "rust-toolchain.toml"]

[[bin]]
name = "ds"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tabled = { version = "0.22.0", features = ["ansi"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_WindowsProgramming"] }

[target."cfg(unix)".dependencies]
libc = "0.2.189"
