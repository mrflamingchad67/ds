[package]
name = "ds"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Lightweight native disk space utility"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tabled = { version = "0.22.0", features = ["ansi"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_WindowsProgramming"] }

[target."cfg(unix)".dependencies]
libc = "0.2.189"
