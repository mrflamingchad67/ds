PackageName: ds
ShortDescription: Disk analyzer that shows what is using your space
Description: |-
  DS reports volume capacity from the platform API and separately walks the
  filesystem to show what is actually using the space.

  It never shells out to du, fsutil, wmic, or any other disk analyzer, and it
  never reads file contents.

  A single-threaded recursive scan with 16 workers by default. Works on
  Windows, Linux, and macOS.
