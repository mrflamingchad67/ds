name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Linux is where the `statvfs` and `/proc/mounts` code paths actually run, so
  # it is the job that proves the non-Windows backend works rather than merely
  # compiles.
  linux:
    name: linux (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test -- --nocapture

      - name: Build release
        run: cargo build --release

  windows:
    name: windows (stable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test -- --nocapture

      - name: Build release
        run: cargo build --release

      # A smoke test that the real Windows code paths execute: drive
      # enumeration, volume capacity, and a live filesystem scan.
      - name: Smoke test volume listing
        shell: pwsh
        run: |
          # Join first: PowerShell's -match returns per-element for arrays, so
          # testing the raw array silently passes or fails for the wrong reason.
          $text = (& .\target\release\ds.exe --plain --ascii | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "ds exited with $LASTEXITCODE" }
          if ($text -notmatch 'Drive') { throw "expected the drive table, got: $text" }
          Write-Host $text

      - name: Smoke test filesystem scan
        shell: pwsh
        run: |
          # Scan the checkout itself and check the summary is well formed.
          $text = (& .\target\release\ds.exe . --plain --ascii --quiet --largest 3 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "ds exited with $LASTEXITCODE" }
          if ($text -notmatch 'Scanned') { throw "expected a scan summary, got: $text" }
          if ($text -notmatch '\d+ files') { throw "expected a file count, got: $text" }
          if ($text -notmatch '\d+ directories') { throw "expected a directory count" }
          if ($text -notmatch 'Path') { throw "expected the directory table header" }
          Write-Host $text

      - name: Smoke test scan of a known directory
        shell: pwsh
        run: |
          # src/ is small and its contents are known, so the report is stable.
          # --largest must exceed the file count so every source file appears.
          $text = (& .\target\release\ds.exe src --plain --ascii --quiet --largest 50 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "ds exited with $LASTEXITCODE" }
          if ($text -notmatch 'main\.rs') { throw "expected main.rs in the report, got: $text" }
          if ($text -notmatch 'scan\.rs') { throw "expected scan.rs in the report" }
          Write-Host $text

      - name: Smoke test JSON output parses
        shell: pwsh
        run: |
          $json = & .\target\release\ds.exe . --json --largest 3 | Out-String
          $parsed = $json | ConvertFrom-Json
          if ($null -eq $parsed.files) { throw "expected a files count" }
          if ($null -eq $parsed.threads) { throw "expected a thread count" }
          if ($null -eq $parsed.largest_files) { throw "expected a largest-files array" }
          Write-Host "files=$($parsed.files) threads=$($parsed.threads)"

      - name: Smoke test threads validation
        shell: pwsh
        run: |
          # An out-of-range worker count must be rejected, not silently clamped.
          & .\target\release\ds.exe . --threads 0 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "--threads 0 should have failed" }
          & .\target\release\ds.exe . --threads 9999 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "--threads 9999 should have failed" }
          Write-Host "unreasonable worker counts correctly rejected"

  # Proves the two targets stay cross-compilable, which catches accidental
  # platform-specific code leaking into shared modules.
  cross:
    name: cross-compile check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, x86_64-pc-windows-gnu, aarch64-apple-darwin]
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check every target, including tests
        run: cargo check --all-targets --target ${{ matrix.target }}