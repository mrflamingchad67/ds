name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish assets for"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Each platform builds natively rather than cross-compiling. Cross-compiling
  # from a single runner would mean bundling a Linux linker, an Apple linker, and
  # a MinGW toolchain in one job, which is a lot of moving parts for a binary
  # this small. Native builds also mean the artifacts match what a user gets
  # from a normal cargo build on that platform.
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64-pc-windows-msvc
            os: windows-latest
            binary: ds.exe
            archive: ds-x86_64-pc-windows-msvc.zip
          - name: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary: ds
            archive: ds-x86_64-unknown-linux-gnu.tar.gz
          - name: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            binary: ds
            archive: ds-aarch64-unknown-linux-gnu.tar.gz
          - name: aarch64-apple-darwin
            os: macos-latest
            binary: ds
            archive: ds-aarch64-apple-darwin.tar.gz
          # macos-13 was retired by GitHub, so the Intel runner label has moved
          # to macos-15-intel. Verified to exist as of 2026-10.
          - name: x86_64-apple-darwin
            os: macos-15-intel
            binary: ds
            archive: ds-x86_64-apple-darwin.tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Show the resolved toolchain
        run: |
          rustup show active-toolchain
          cargo --version

      - name: Build
        run: cargo build --release --target ${{ matrix.name }}

      - name: Verify the binary actually runs
        shell: bash
        run: |
          BIN="target/${{ matrix.name }}/release/${{ matrix.binary }}"
          "$BIN" --version
          if [[ "${{ matrix.os }}" == windows* ]]; then
            "$BIN" --plain --ascii | head -5
          else
            "$BIN" --plain --ascii | head -5
          fi

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.name }}/release
          strip ds || true
          tar czf "$GITHUB_WORKSPACE/${{ matrix.archive }}" ds
          cd "$GITHUB_WORKSPACE"
          sha256sum "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.name }}/release/${{ matrix.binary }}" -DestinationPath "${{ matrix.archive }}"
          $hash = (Get-FileHash "${{ matrix.archive }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.archive }}" | Out-File -FilePath "${{ matrix.archive }}.sha256" -Encoding ascii -NoNewline

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
          if-no-files-found: error

  # Everything above must succeed before the tag gets a release attached to it.
  # A tag pointing at a release with missing assets is worse than a failed
  # workflow, because it looks like a finished install.
  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: release-*
          merge-multiple: true

      - name: Write the release notes
        run: |
          # A heredoc rather than a chain of echo calls. The previous version
          # mixed single and double quotes inside echo, which bash parsed as an
          # unterminated string and the step died before creating the file.
          cat > NOTES.md <<'EOF'
          Fast native disk analyzer for Windows, Linux, and macOS.

          One binary per platform, no runtime dependencies, and a SHA256 file
          alongside every archive. See the README for flags and behavior notes.

          ### Install

          ```powershell
          winget install mrflamingchad67.ds
          ```

          ```sh
          cargo install disk-spacer
          ```

          ### Verify a download

          ```sh
          sha256sum -c ds-x86_64-unknown-linux-gnu.tar.gz.sha256
          ```

          On PowerShell:

          ```powershell
          Get-FileHash ds-x86_64-pc-windows-msvc.zip -Algorithm SHA256
          ```
          EOF
          sed -i 's/^          //' NOTES.md
          cat NOTES.md

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # This job does not check out the repository, so gh cannot infer the
          # target from a git remote and fails with "not a git repository".
          # Naming the repo explicitly is the fix.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber --repo "$REPO"
            gh release edit "$TAG" --notes-file NOTES.md --repo "$REPO"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file NOTES.md \
              --verify-tag \
              --repo "$REPO" \
              assets/*
          fi
